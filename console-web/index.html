<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
        try {
          var lang = localStorage.getItem('amygo-locale')
          var ok = lang === 'zh-CN' || lang === 'zh-TW' || lang === 'fr' || lang === 'ja' || lang === 'en'
          document.documentElement.lang = ok ? lang : 'zh-CN'
        } catch (_) {
          document.documentElement.lang = 'zh-CN'
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/amygo-ai-c.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMYGO RaaS · Ops Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
