server:
  port: 8080

spring:
  application:
    name: amygo-raas-control-plane
  datasource:
    url: jdbc:h2:mem:raas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

raas:
  demo-tenant-id: tenant-demo
  demo-site-id: site-demo
  simulator:
    # none | fail_on_submit | expire | duplicate_events | out_of_order
    fault-mode: none
    model-profiles:
      - sim.delivery.v1
      - sim.cleaning.v1
      - sim.hotel.v1
